<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Subtle Islamic Geometric Pattern Accent -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="4" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="12 8" opacity="0.4" />

  <!-- Arabic Sin 'س' Symbol (SIRAJ Initial) in Calligraphic Style -->
  <text x="256" y="320" font-family="'Amiri', 'Scheherazade New', serif" font-size="280" font-weight="bold" fill="url(#gold)" text-anchor="middle" filter="url(#glow)">
    س
  </text>

  <!-- Glowing Lantern / Crescent Star Accent at Top -->
  <path d="M 256 90 A 24 24 0 1 0 270 120 A 18 18 0 1 1 256 90 Z" fill="url(#gold)" opacity="0.9" />
</svg>